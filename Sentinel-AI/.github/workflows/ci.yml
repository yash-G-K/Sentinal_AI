name: Sentinel AI — CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Job 1: Lint & Format ────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff black

      - name: Run ruff (fast linter)
        run: ruff check app/ tests/ --output-format=github

      - name: Run black (format check)
        run: black --check app/ tests/


  # ── Job 2: Unit & Integration Tests ────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sentinelpass
          MYSQL_DATABASE: sentinel_ai
          MYSQL_USER: sentinel
          MYSQL_PASSWORD: sentinelpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql+pymysql://sentinel:sentinelpass@localhost:3306/sentinel_ai
      AI_ENABLED: "false"
      REDIS_URL: ""
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pytest-cov

      - name: Run unit & integration tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/load \
            --ignore=tests/e2e \
            --ignore=tests/security \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false


  # ── Job 3: Security Tests ────────────────────────────────────────────────────
  security-tests:
    name: 🛡️ WAF Security Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sentinelpass
          MYSQL_DATABASE: sentinel_ai
          MYSQL_USER: sentinel
          MYSQL_PASSWORD: sentinelpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql+pymysql://sentinel:sentinelpass@localhost:3306/sentinel_ai
      AI_ENABLED: "false"
      REDIS_URL: ""
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run WAF security payload tests
        run: |
          pytest tests/security/ -v \
            --tb=short \
            -q


  # ── Job 4: Dependency Security Scanning ─────────────────────────────────────
  dependency-scan:
    name: 🔒 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2022-42969 \
            --format=json \
            --output=audit-report.json || true

      - name: Show audit report
        run: |
          if [ -f audit-report.json ]; then
            cat audit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          vulns = data.get('dependencies', [])
          critical = [d for d in vulns if any(v.get('fix_versions') for v in d.get('vulns', []))]
          print(f'Total packages scanned: {len(vulns)}')
          print(f'Packages with known vulnerabilities: {len(critical)}')
          for d in critical:
              for v in d.get(\"vulns\", []):
                  print(f'  ❗ {d[\"name\"]}=={d[\"version\"]}: {v[\"id\"]} — {v[\"description\"][:80]}')
          "
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: backend/audit-report.json


  # ── Job 5: Coverage Summary ──────────────────────────────────────────────────
  coverage-report:
    name: 📊 Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
        continue-on-error: true

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
